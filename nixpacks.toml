# Force Railway to use proper Python setup
providers = ["python"]

[phases.setup]
nixPkgs = ["python311Full", "python311Packages.pip"]

[phases.install]
dependsOn = ["setup"]
cmds = ["python3.11 -m pip install --upgrade pip", "python3.11 -m pip install -r requirements.txt"]

[start]
cmd = "python3.11 -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"

[variables]
PYTHON_VERSION = "3.11"
