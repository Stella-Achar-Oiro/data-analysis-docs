<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Data Analysis Documentation{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23007bff' width='100' height='100' rx='10'/><text y='.9em' x='50%' text-anchor='middle' font-size='70' fill='white'>D</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <!-- Main Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">

    {% block head %}{% endblock %}
</head>
<body data-user-email="{{ user_email }}" data-timestamp="{{ timestamp }}">
    <!-- Dynamic Watermark Overlay -->
    {% if user_email %}
    <div class="watermark-overlay" id="watermarkOverlay">
        <span class="watermark-text">
            {{ user_email }}<br>
            {{ timestamp }}<br>
            DEMO DOCUMENTATION<br>
            NOT FOR DISTRIBUTION
        </span>
    </div>

    <!-- Repeating Watermark Grid -->
    <div class="watermark-grid" id="watermarkGrid"></div>
    {% endif %}

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- Security Scripts -->
    {% if user_email %}
    <script src="/static/js/security.js"></script>
    {% endif %}

    <!-- Mermaid Initialization -->
    <script src="/static/js/mermaid-init.js"></script>

    {% block scripts %}{% endblock %}

    <!-- Watermark Grid Generator -->
    {% if user_email %}
    <script>
        (function() {
            const grid = document.getElementById('watermarkGrid');
            if (grid) {
                const email = '{{ user_email }}';
                const time = '{{ timestamp }}';
                const watermarkText = email + ' | ' + time + ' | DEMO';

                // Create multiple watermark instances
                for (let i = 0; i < 20; i++) {
                    const span = document.createElement('span');
                    span.className = 'watermark-item';
                    span.textContent = watermarkText;
                    grid.appendChild(span);
                }
            }
        })();
    </script>
    {% endif %}
</body>
</html>
